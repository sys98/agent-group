<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">orca-dispatch</title>
  <desc id="desc">One coordinator splits a bug fix or feature into parallel Orca worker lanes, waits on each worker_done, reviews every branch, and merges them.</desc>

  <rect width="1200" height="400" rx="24" fill="#0B0F14"/>

  <g id="title-block" transform="translate(56 64)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#7A8594" letter-spacing="2">ORCA · SUPERVISED MULTI-AGENT DISPATCH</text>
    <text x="0" y="78" font-size="68" font-weight="700" fill="#E8E4DA">orca-dispatch</text>
    <text x="0" y="136" font-size="27" fill="#E8E4DA">一条命令：排查 / 澄清 → 拆分 → 并行执行</text>
    <text x="0" y="176" font-size="27" fill="#E8E4DA">→ 逐分支 review → 合并</text>
    <text x="0" y="226" font-size="21" fill="#7A8594">coordinator 负责验收，你只在决策点拍板</text>
    <g transform="translate(0 266)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <rect x="0" y="-26" width="300" height="40" rx="8" fill="#141B24" stroke="#243041"/>
      <text x="16" y="0" fill="#3DDC97">$</text>
      <text x="36" y="0" fill="#E8E4DA">/orca-dispatch 先确认</text>
      <text x="324" y="0" fill="#7A8594">Claude Code · Codex</text>
    </g>
  </g>

  <g id="dispatch-board" transform="translate(712 44)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="0" y="0" width="436" height="312" rx="16" fill="#111821" stroke="#243041"/>
    <text x="24" y="38" font-size="18" fill="#7A8594">run_3f9c · wave 1</text>
    <circle cx="410" cy="32" r="6" fill="#3DDC97"/>

    <g id="lane-1" transform="translate(24 66)">
      <rect x="0" y="0" width="388" height="52" rx="10" fill="#0B0F14"/>
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#3DDC97"/>
      <text x="22" y="32" font-size="20" fill="#E8E4DA">修复-鉴权超时</text>
      <text x="368" y="32" font-size="18" fill="#3DDC97" text-anchor="end">merged</text>
    </g>
    <g id="lane-2" transform="translate(24 130)">
      <rect x="0" y="0" width="388" height="52" rx="10" fill="#0B0F14"/>
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#3DDC97"/>
      <text x="22" y="32" font-size="20" fill="#E8E4DA">服务端-素材接口</text>
      <text x="368" y="32" font-size="18" fill="#3DDC97" text-anchor="end">reviewed</text>
    </g>
    <g id="lane-3" transform="translate(24 194)">
      <rect x="0" y="0" width="388" height="52" rx="10" fill="#0B0F14"/>
      <rect x="0" y="0" width="6" height="52" rx="3" fill="#F5B544"/>
      <text x="22" y="32" font-size="20" fill="#E8E4DA">前端-生成面板</text>
      <text x="368" y="32" font-size="18" fill="#F5B544" text-anchor="end">question</text>
    </g>

    <text x="24" y="286" font-size="18" fill="#7A8594">check --ack · worker_done 2/3</text>
  </g>
</svg>
