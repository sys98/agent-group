<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">agent-group：多代理交付编排技能</title>
  <desc id="desc">选择 Orca worker 或 Codex 原生子代理，由 coordinator 统一调查、拆分、监督、审查和集成。</desc>
  <rect width="1200" height="390" rx="24" fill="#0B0F14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8994A3">AGENT-GROUP / DELIVERY WORKFLOWS</text>
    <text x="58" y="137" font-size="58" font-weight="700" fill="#F1EEE7">多代理协作，</text>
    <text x="58" y="204" font-size="58" font-weight="700" fill="#F1EEE7">交付有验收</text>
    <text x="58" y="253" font-size="24" fill="#B8C0CB">从问题调查到集成验证，coordinator 负责到底。</text>
    <text x="58" y="300" font-size="20" fill="#8994A3">选宿主工作：Orca worker  /  Codex 原生子代理</text>
  </g>

  <g id="routes" transform="translate(690 56)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="0" y="0" width="454" height="278" rx="18" fill="#111821" stroke="#263140" stroke-width="2"/>
    <rect x="26" y="24" width="402" height="67" rx="12" fill="#0B0F14"/>
    <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#8994A3">COORDINATOR</text>
    <text x="48" y="78" font-size="22" font-weight="600" fill="#F1EEE7">调查 · 拆分 · 验收</text>

    <path d="M227 91 V113 M227 113 H122 V131 M227 113 H332 V131" fill="none" stroke="#526071" stroke-width="3"/>
    <circle cx="227" cy="113" r="5" fill="#F1EEE7"/>

    <g id="orca-route" transform="translate(26 132)">
      <rect width="190" height="91" rx="12" fill="#17170F" stroke="#D7A84A" stroke-width="2"/>
      <text x="18" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#D7A84A">ORCA</text>
      <text x="18" y="61" font-size="22" font-weight="600" fill="#F1EEE7">Run · workers</text>
      <text x="18" y="83" font-size="18" fill="#B9A779">分支审查与集成</text>
    </g>
    <g id="codex-route" transform="translate(238 132)">
      <rect width="190" height="91" rx="12" fill="#101A19" stroke="#52C7A5" stroke-width="2"/>
      <text x="18" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#52C7A5">CODEX</text>
      <text x="18" y="61" font-size="22" font-weight="600" fill="#F1EEE7">原生子代理</text>
      <text x="18" y="83" font-size="18" fill="#91C7B7">任务账本与验证</text>
    </g>
    <path d="M121 223 V244 H227 M333 223 V244 H227 V251" fill="none" stroke="#526071" stroke-width="3"/>
    <rect x="118" y="246" width="218" height="26" rx="13" fill="#202A35"/>
    <text x="227" y="266" text-anchor="middle" font-size="18" font-weight="600" fill="#F1EEE7">复核结果 · 按授权集成</text>
  </g>
</svg>
